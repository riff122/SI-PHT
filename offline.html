<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda Sedang Offline - TernakApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#198754">
    <link rel="icon" type="image/png" href="images/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #1f2937;
            padding: 1.5rem;
        }

        .offline-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(25, 135, 84, 0.12);
            padding: 3rem 2rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(25, 135, 84, 0.15);
        }

        .offline-icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem auto;
            background: #e8f5e9;
            color: #198754;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(25, 135, 84, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); }
        }

        .btn-retry {
            background: #198754;
            color: #ffffff;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.8rem 2rem;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-retry:hover {
            background: #157347;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(25, 135, 84, 0.25);
        }
    </style>
</head>

<body>

    <div class="offline-card">
        <div class="offline-icon-wrapper">
            <i class="bi bi-wifi-off"></i>
        </div>

        <h2 class="fw-bold mb-2">Koneksi Terputus</h2>
        <p class="text-muted mb-4">
            Anda sedang tidak terhubung ke jaringan internet. Periksa koneksi Wi-Fi atau data seluler Anda, lalu coba muat ulang halaman.
        </p>

        <div class="d-flex flex-column gap-2">
            <button class="btn btn-retry" onclick="window.location.reload()">
                <i class="bi bi-arrow-clockwise me-1"></i> Coba Muat Ulang
            </button>
            <a href="home.php" class="btn btn-outline-secondary rounded-3 py-2 mt-2">
                ← Kembali ke Beranda
            </a>
        </div>

        <div class="mt-4 pt-3 border-top text-muted small">
            <i class="bi bi-shield-check text-success me-1"></i> <strong>TernakApp</strong> Progressive Web App
        </div>
    </div>

</body>

</html>
